<!DOCTYPE html>
<html lang="es">
<head>
<!-- NanamyOS Version: 2.2.0 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanamyOS</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #0f1420;
    --surface: #161b26;
    --surface-hover: #1d2433;
    --border: #232b3a;
    --accent: #00e5ff;
    --accent-soft: rgba(0, 229, 255, 0.12);
    --accent-glow: rgba(0, 229, 255, 0.35);
    --green: #7cffb2;
    --text: #e8edf4;
    --subtext: #7e8ba0;
    --danger: #ff4d6d;
    --taskbar-h: 52px;
    --font-ui: 'JetBrains Mono', 'Cascadia Code', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-ui);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    cursor: url('data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2026%2026%22%3E%3Cpath%20d%3D%22M3%202%20L3%2021%20L8.2%2016.4%20L11.4%2023%20L14.6%2021.5%20L11.5%2015%20L18%2015%20Z%22%20fill%3D%22%230b0e14%22%20stroke%3D%22%2300e5ff%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E') 3 2, auto;
  }

  a, button, .icon, .fs-item, .ctx-item, .task-chip, .recent-item,
  .win-btn, .win-back, .win-upload, .editor-save-btn, #start-btn, .modal-btn,
  .resize-handle, [onclick], [data-clickable] {
    cursor: url('data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2026%2026%22%3E%3Cpath%20d%3D%22M3%202%20L3%2021%20L8.2%2016.4%20L11.4%2023%20L14.6%2021.5%20L11.5%2015%20L18%2015%20Z%22%20fill%3D%22%230b0e14%22%20stroke%3D%22%237cffb2%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E') 3 2, pointer !important;
  }

  #desktop {
    position: relative;
    width: 100%;
    height: calc(100% - var(--taskbar-h));
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 24%, rgba(0,229,255,0.07), transparent 38%),
      radial-gradient(circle at 82% 76%, rgba(124,255,178,0.06), transparent 42%),
      linear-gradient(160deg, #0b0e14 0%, #0a0d12 55%, #090b10 100%);
  }

  #desktop::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events: none;
  }

  .wallpaper-eyes {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex; gap: 64px;
    pointer-events: none; opacity: 0.05;
  }
  .wallpaper-eyes .eye {
    width: 180px; height: 280px;
    border-radius: 56px;
    background: var(--accent);
    box-shadow: 0 0 140px 40px var(--accent-glow);
  }
  .wallpaper-watermark {
    position: absolute; bottom: 22px; right: 28px;
    font-size: 12px; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.10); pointer-events: none;
  }

  /* ── ICONOS (escalables via --icon-w/h) ── */
  #icon-grid {
    position: absolute;
    top: 24px; left: 24px;
    right: 24px;
    height: calc(100% - 48px);
  }

  .icon {
    position: absolute;
    width: var(--icon-w, 110px); height: var(--icon-h, 115px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    gap: 10px; padding: 12px 5px;
    border-radius: 12px; cursor: pointer;
    transition: background-color 120ms ease, transform 80ms ease;
  }
  .icon:hover  { background: rgba(255,255,255,0.06); }
  .icon:active { transform: scale(0.96); background: var(--accent-soft); }
  .icon.selected { background: var(--accent-soft); outline: 1px solid rgba(0,229,255,0.4); }

  .icon-glyph {
    width: var(--icon-glyph-s, 55px); height: var(--icon-glyph-s, 55px);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--icon-glyph-font, 25px);
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .icon:hover .icon-glyph {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .icon-label {
    font-size: var(--icon-label-font, 12px); text-align: center;
    color: var(--text); line-height: 1.3;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .icon-glyph.folder { color: var(--accent); }
  .icon-glyph.app    { color: var(--green); }
  .icon-glyph.trash  { color: var(--subtext); font-size: calc(var(--icon-glyph-font, 25px) * 0.88); }
  .icon.dragging     { opacity: 0.5; z-index: 10; pointer-events: none; }

  /* resalta la carpeta/ventana/escritorio que recibira el archivo al soltar */
  [data-focuspath].drop-target {
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
    background: var(--accent-soft);
  }

  /* "fantasma" que sigue al mouse al arrastrar un archivo/carpeta dentro de un explorador */
  .fs-drag-ghost {
    position: fixed; z-index: 999999; pointer-events: none;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 8px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--accent);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    opacity: 0.92;
  }
  .fs-drag-ghost .fs-glyph { width: 32px; height: 32px; font-size: 16px; }
  .fs-drag-ghost .fs-name  { font-size: 10px; color: var(--text); max-width: 100px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* overlay global que aparece al arrastrar archivos/carpetas DESDE el sistema
     operativo (Windows/Linux/Mac) sobre la ventana del navegador */
  #os-drop-overlay {
    position: fixed; inset: 0; z-index: 999998;
    display: none;
    background: rgba(11, 14, 20, 0.45);
    backdrop-filter: blur(2px);
    pointer-events: none; /* deja pasar los dragenter/dragover/drop al elemento de abajo */
  }
  #os-drop-overlay.show { display: block; }
  #os-drop-overlay .os-drop-hint {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 22px 30px; border-radius: 14px;
    background: var(--surface); border: 1.5px dashed var(--accent);
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    color: var(--text); font-size: 13px; text-align: center;
  }
  #os-drop-overlay .os-drop-hint .os-drop-icon { font-size: 30px; color: var(--accent); }
  #os-drop-overlay .os-drop-hint .os-drop-target-name { color: var(--accent); font-weight: 600; }

  /* indicador de progreso de subida (toast inferior) */
  #upload-toast {
    position: fixed; left: 50%; bottom: calc(var(--taskbar-h) + 16px);
    transform: translateX(-50%);
    z-index: 999997;
    display: none; flex-direction: column; gap: 6px;
    min-width: 260px; max-width: 360px;
    padding: 12px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  #upload-toast.show { display: flex; }
  #upload-toast .upload-toast-label {
    font-size: 11px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #upload-toast .upload-toast-bar {
    height: 4px; border-radius: 3px; background: var(--bg-soft);
    overflow: hidden;
  }
  #upload-toast .upload-toast-bar-fill {
    height: 100%; width: 0%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    transition: width 120ms ease;
  }

  /* ── START MENU ── */
  #start-menu {
    position: absolute; left: 10px;
    bottom: calc(var(--taskbar-h) + 8px);
    width: 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.55);
    padding: 10px;
    display: none; flex-direction: column; gap: 4px;
    z-index: 9999;
  }
  #start-menu.show { display: flex; }

  .start-menu-header { font-size: 11px; letter-spacing: 0.12em; color: var(--subtext); padding: 4px 8px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #fullscreen-btn {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px;
    background: transparent; border: 1px solid var(--border);
    color: var(--subtext); font-size: 12px; padding: 0;
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  #fullscreen-btn:hover { background: var(--surface-hover); border-color: var(--accent); color: var(--accent); }

  .recent-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 7px;
    font-size: 12px; color: var(--text); cursor: pointer;
  }
  .recent-item:hover { background: var(--surface-hover); }
  .recent-item .recent-glyph {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--bg-soft); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--accent); flex: none;
  }
  .recent-empty { padding: 14px 8px; font-size: 11px; color: var(--subtext); text-align: center; }
  .start-menu-footer { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; }
  #power-btn {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 7px;
    background: transparent; border: none;
    color: var(--danger); font-family: var(--font-ui);
    font-size: 12px; cursor: pointer;
    transition: background-color 120ms ease;
  }
  #power-btn:hover { background: rgba(255,77,109,0.10); }

  /* --- Browser specific --- */
  .browser-bookmarks-dropdown {
    position: absolute;
    top: 45px; right: 10px;
    min-width: 220px; max-width: 350px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    z-index: 1000;
    display: none;
    flex-direction: column;
    padding: 10px 0;
    backdrop-filter: blur(10px);
  }
  .browser-bookmarks-dropdown.show { display: flex; }
  .bookmark-item {
    padding: 8px 16px;
    font-size: 13px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .bookmark-item:hover { background: var(--surface-hover); color: var(--accent); }
  .bookmark-info {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex: 1;
  }
  .bookmark-title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bookmark-url { font-size: 10px; color: var(--subtext); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bookmark-del { color: var(--danger); opacity: 0.6; padding: 4px; font-weight: bold; }
  .bookmark-del:hover { opacity: 1; }

  .win-fullscreen-os { font-size: 14px; margin-right: 2px; }

  /* ── VENTANAS ── */
  .window {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    display: none; flex-direction: column;
    overflow: hidden;
    min-width: 280px; min-height: 200px;
  }
  .window.show { display: flex; }
  .window.anim-max {
    transition: top 220ms cubic-bezier(.2,.7,.3,1), left 220ms cubic-bezier(.2,.7,.3,1),
                width 220ms cubic-bezier(.2,.7,.3,1), height 220ms cubic-bezier(.2,.7,.3,1),
                border-radius 220ms cubic-bezier(.2,.7,.3,1);
  }
  .window.anim-min {
    transition: transform 220ms cubic-bezier(.4,0,.2,1), opacity 220ms cubic-bezier(.4,0,.2,1);
  }
  .window.maximized {
    top: 0 !important; left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 0;
  }
  .window.os-fullscreen-mode {
    z-index: 10000 !important;
    border: none !important;
  }
  .window.os-fullscreen-mode .window-titlebar,
  .window.os-fullscreen-mode .browser-toolbar {
    display: none !important;
  }
  .window.os-fullscreen-mode .window-body {
    border-radius: 0 !important;
  }

  .window-titlebar {
    height: 38px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    cursor: move;
  }
  .window-titlebar .win-icon { color: var(--accent); font-size: 14px; }
  .window-titlebar .win-title { flex: 1; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .win-btn {
    width: 22px; height: 22px; border-radius: 5px;
    background: transparent; border: none;
    color: var(--subtext); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .win-btn:hover { background: var(--surface-hover); color: var(--text); }
  .win-close:hover { background: var(--danger) !important; color: #fff !important; }

  .window-toolbar {
    height: 34px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .win-back {
    width: 24px; height: 24px; border-radius: 5px;
    background: var(--bg-soft); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 12px;
  }
  .win-back:hover { border-color: var(--accent); color: var(--accent); }
  .win-back:disabled { opacity: 0.3; cursor: default; }
  .win-back:disabled:hover { border-color: var(--border); color: var(--text); }
  .win-path {
    font-size: 11px; color: var(--subtext); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .win-upload {
    width: 24px; height: 24px; border-radius: 5px;
    background: var(--bg-soft); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 12px;
    flex: none; display: flex; align-items: center; justify-content: center;
  }
  .win-upload:hover { border-color: var(--accent); color: var(--accent); }

  .window-body {
    flex: 1; overflow-y: auto; padding: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, var(--fs-item-w, 97px));
    gap: 4px; align-content: flex-start;
  }

  /* cuerpo del visor/editor (no grid) */
  .window-body.viewer {
    display: flex; flex-direction: column;
    padding: 0; overflow: hidden;
  }

  .fs-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 8px 4px; border-radius: 8px; cursor: pointer;
  }
  .fs-item:hover { background: var(--surface-hover); }
  .fs-glyph {
    width: var(--fs-glyph-s, 44px); height: var(--fs-glyph-s, 44px); border-radius: 9px;
    background: var(--bg-soft); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-glyph-font, 20px);
  }
  .fs-item.is-dir .fs-glyph  { color: var(--accent); }
  .fs-item.is-file .fs-glyph { color: var(--subtext); }
  .fs-name {
    font-size: var(--fs-name-font, 11px); text-align: center;
    color: var(--text); line-height: 1.2; word-break: break-word;
  }
  .fs-empty, .fs-error {
    grid-column: 1 / -1; text-align: center;
    font-size: 11px; color: var(--subtext); padding: 30px 0;
  }
  .fs-error { color: var(--danger); }

  /* handle resize */
  .resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 16px; height: 16px;
    cursor: se-resize; z-index: 10;
  }
  .resize-handle::after {
    content: '';
    position: absolute; bottom: 3px; right: 3px;
    width: 8px; height: 8px;
    border-right: 2px solid var(--subtext);
    border-bottom: 2px solid var(--subtext);
    border-radius: 1px;
  }

  /* ── EDITOR DE TEXTO ── */
  #txt-editor {
    flex: 1; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    border: none; outline: none;
    padding: 14px;
    resize: none;
    line-height: 1.6;
    user-select: text;
    -webkit-user-select: text;
  }
  .editor-toolbar {
    height: 34px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .editor-save-btn {
    padding: 4px 12px; border-radius: 6px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-ui);
    font-size: 11px; cursor: pointer;
  }
  .editor-save-btn:hover { background: var(--accent); color: var(--bg); }
  .editor-status {
    font-size: 11px; color: var(--subtext); flex: 1;
  }

  /* ── VISOR MEDIA (imagen/video/audio/pdf) ── */
  .media-container {
    flex: 1; display: flex;
    align-items: center; justify-content: center;
    overflow: auto; padding: 10px; background: #000;
  }
  .media-container img  { max-width: 100%; max-height: 100%; object-fit: contain; }
  .media-container video,
  .media-container audio { max-width: 100%; outline: none; }
  .media-container audio { margin: auto; }
  .media-container iframe { width: 100%; height: 100%; border: none; }

  /* ── TASKBAR ── */
  #taskbar {
    height: var(--taskbar-h);
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px;
    background: rgba(15,20,32,0.92);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(10px);
    position: relative; z-index: 5;
  }
  #start-btn {
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px 0 10px;
    border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-ui);
    font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  #start-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
  #start-btn .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 2px var(--accent-glow);
  }
  #taskbar-divider { width: 1px; height: 26px; background: var(--border); }
  #open-windows { flex: 1; display: flex; gap: 6px; overflow-x: auto; }

  .task-chip {
    display: flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 12px;
    border-radius: 7px; font-size: 12px;
    color: var(--subtext); background: transparent;
    border: 1px solid transparent;
    cursor: pointer; white-space: nowrap;
    transition: background-color 120ms ease, color 120ms ease;
    font-family: var(--font-ui);
  }
  .task-chip:hover { background: var(--surface); color: var(--text); }
  .task-chip.active { background: var(--surface); border-color: var(--accent); color: var(--text); }
  .task-chip-close {
    margin-left: 4px; opacity: 0.5; font-size: 11px;
    border-radius: 3px; padding: 1px 3px;
  }
  .task-chip-close:hover { opacity: 1; background: var(--danger); color: #fff; }

  #tray {
    display: flex; align-items: center; gap: 14px;
    padding-right: 6px; font-size: 12px; color: var(--subtext);
  }
  #tray .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 6px 1px rgba(124,255,178,0.5);
  }
  #clock { color: var(--text); font-weight: 600; min-width: 58px; text-align: right; }

  /* ── CONTEXT MENU ── */
  #ctx-menu {
    position: absolute; min-width: 180px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    padding: 6px; display: none; z-index: 99999;
  }
  #ctx-menu.show { display: block; }
  .ctx-item { padding: 8px 10px; font-size: 12px; border-radius: 6px; color: var(--text); cursor: pointer; }
  .ctx-item:hover { background: var(--surface-hover); color: var(--accent); }
  .ctx-item-danger { color: var(--danger); }
  .ctx-item-danger:hover { background: rgba(255,77,109,0.12); color: var(--danger); }
  .ctx-sep { height: 1px; background: var(--border); margin: 5px 4px; }

  /* ── MODAL DE SISTEMA (reemplaza alert/prompt/confirm del navegador) ── */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(5, 7, 11, 0.55);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 999999;
  }

<script>
// ══════════════════════════════════════════════════════
//  ESCALADO DE LA UI SEGUN EL TAMANO REAL DE LA PANTALLA
//  Todo el diseno (ventanas, iconos, fuentes) esta hecho en px fijos
//  pensando en una pantalla "de referencia". Eso se ve bien en una
//  maquina pero distinto en otra con resolucion/escalado del SO
//  diferente, porque "px fijos" son siempre el mismo tamano visual
//  sin importar cuanta pantalla real tengas disponible.
//  Usamos screen.width (resolucion REAL del monitor en px CSS, ya
//  normalizada por el escalado del SO, y que NO cambia si esta pagina
//  hace zoom) para calcular un factor relativo a una referencia de
//  1920px, y lo aplicamos con CSS "zoom" sobre <html>. zoom escala
//  todo el layout (incluyendo coordenadas de mouse/clientX/Y, a
//  diferencia de transform:scale), asi que todo el codigo existente
//  de drag/resize en px sigue funcionando sin tocarlo.
// ══════════════════════════════════════════════════════
(function aplicarEscalaUI() {
  const REF_W = 1920;
  const MIN_ESCALA = 0.65;
  const MAX_ESCALA = 1.35;
  let factor = (screen.width || window.innerWidth) / REF_W;
  factor = Math.min(MAX_ESCALA, Math.max(MIN_ESCALA, factor));
  document.documentElement.style.zoom = factor;
})();

// ══════════════════════════════════════════════════════
//  ESCALA DE ICONOS DEL ESCRITORIO (x1 / x1.15 / x1.25 / x1.50 / x2)
//  Guarda la preferencia en localStorage y la aplica via CSS variables.
// ══════════════════════════════════════════════════════
const ESCALAS_ICONOS = [1, 1.15, 1.25, 1.5, 2];
const ESCALA_ICONO_KEY = 'nanamyos_icon_scale';

function _getEscalaIconos() {
  try {
    const v = parseFloat(localStorage.getItem(ESCALA_ICONO_KEY));
    return ESCALAS_ICONOS.includes(v) ? v : 1;
  } catch(e) { return 1; }
}

function aplicarEscalaIconos(factor) {
  window._iconScaleFactor = factor;
  const r = document.documentElement;
  // iconos del escritorio
  r.style.setProperty('--icon-w',          Math.round(110 * factor) + 'px');
  r.style.setProperty('--icon-h',          Math.round(115 * factor) + 'px');
  r.style.setProperty('--icon-glyph-s',    Math.round(55  * factor) + 'px');
  r.style.setProperty('--icon-glyph-font', Math.round(25  * factor) + 'px');
  r.style.setProperty('--icon-label-font', Math.round(12  * factor) + 'px');
  // iconos del explorador de archivos
  r.style.setProperty('--fs-glyph-s',    Math.round(44  * factor) + 'px');
  r.style.setProperty('--fs-glyph-font', Math.round(20  * factor) + 'px');
  r.style.setProperty('--fs-name-font',  Math.round(11  * factor) + 'px');
  r.style.setProperty('--fs-item-w',     Math.round(97  * factor) + 'px');
  _recalcularCeldasIconos(factor);
}

function _recalcularCeldasIconos(factor) {
  const W = Math.round(120 * factor);
  const H = Math.round(125 * factor);
  if (typeof iconGrid === 'undefined' || !iconGrid) return;
  iconGrid.querySelectorAll('.icon').forEach(ic => {
    const col = +ic.dataset.col, fila = +ic.dataset.fila;
    ic.style.left = (col * W) + 'px';
    ic.style.top  = (fila * H) + 'px';
  });
}

// Aplicar variables CSS al cargar (NO referencias al DOM todavía — esas vienen después)
(function() {
  const s = _getEscalaIconos();
  window._iconScaleFactor = s;
  const r = document.documentElement;
  r.style.setProperty('--icon-w',          Math.round(110 * s) + 'px');
  r.style.setProperty('--icon-h',          Math.round(115 * s) + 'px');
  r.style.setProperty('--icon-glyph-s',    Math.round(55  * s) + 'px');
  r.style.setProperty('--icon-glyph-font', Math.round(25  * s) + 'px');
  r.style.setProperty('--icon-label-font', Math.round(12  * s) + 'px');
  r.style.setProperty('--fs-glyph-s',    Math.round(44  * s) + 'px');
  r.style.setProperty('--fs-glyph-font', Math.round(20  * s) + 'px');
  r.style.setProperty('--fs-name-font',  Math.round(11  * s) + 'px');
  r.style.setProperty('--fs-item-w',     Math.round(97  * s) + 'px');
})();

// ══════════════════════════════════════════════════════
//  I18N — TRADUCCIÓN EN TIEMPO REAL (ES / EN)
// ══════════════════════════════════════════════════════

const I18N = {
  // taskbar / start menu
  'os.name':            { es: 'NanamyOS',                  en: 'NanamyOS' },
  'start.recent':        { es: 'RECIENTES',                en: 'RECENT' },
  'start.recentEmpty':   { es: 'Nada abierto todavia',     en: 'Nothing opened yet' },
  'start.power':         { es: '⏻ Apagar NanamyOS',        en: '⏻ Shut down NanamyOS' },
  'tray.sdOk':           { es: 'SD OK',                    en: 'SD OK' },
  // ventana plantilla
  'win.maximize':        { es: 'Maximizar',                en: 'Maximize' },
  'win.minimize':        { es: 'Minimizar',                en: 'Minimize' },
  'win.close':           { es: 'Cerrar',                   en: 'Close' },
  'win.default':         { es: 'Ventana',                  en: 'Window' },
  // iconos fijos del escritorio
  'icon.home':           { es: 'Home',                     en: 'Home' },
  'icon.config':         { es: 'Config',                   en: 'Settings' },

function _t(key, ...args) {
  const entry = I18N[key];
  if (!entry) return key;
  const lang = (window._idioma === 'en') ? 'en' : 'es';
  let str = entry[lang] || entry.es || key;
  args.forEach((a, i) => { str = str.replace('{' + i + '}', a); });
  return str;
}
window._idioma = (function() {
  try { return localStorage.getItem('nanamyos_lang') || 'en'; } catch(e) { return 'en'; }
})();

function _setIdioma(lang) {
  window._idioma = lang === 'en' ? 'en' : 'es';
  try { localStorage.setItem('nanamyos_lang', window._idioma); } catch(e) {}
  _retraducirUI();
}

// re-traduce todo lo visible actualmente (estático + dinámico abierto)
function _retraducirUI() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = _t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    el.innerHTML = _t(el.dataset.i18nHtml);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = _t(el.dataset.i18nTitle);
  });
  // chips de taskbar con titulo traducible
  document.querySelectorAll('[data-i18n-chip]').forEach(el => {
    const key = el.dataset.i18nChip;
    const iconoCh = el.dataset.chipIcon || '';
    el.textContent = iconoCh + ' ' + _t(key);
  });
  // re-render del start menu (recientes) y ventanas dinámicas que dependan del idioma
  if (typeof dibujarRecientes === 'function') dibujarRecientes();
  if (typeof refrescarVentanasAbiertasIdioma === 'function') refrescarVentanasAbiertasIdioma();
}

const modalOverlay = document.getElementById('modal-overlay');
const modalIcon    = document.getElementById('modal-icon');
const modalTitle   = document.getElementById('modal-title');
const modalMsg     = document.getElementById('modal-msg');
const modalInput   = document.getElementById('modal-input');
const modalActions = document.getElementById('modal-actions');

function _cerrarModal() {
  modalOverlay.classList.remove('show');
  modalInput.style.display = 'none';
  modalInput.value = '';
}

// sysAlert(mensaje, { titulo, tipo }) -> Promise<void>
function sysAlert(mensaje, opts = {}) {
  return new Promise((resolve) => {
    modalIcon.className = 'modal-icon ' + (opts.tipo || 'info');
    modalIcon.textContent = opts.tipo === 'error' ? '✕' : opts.tipo === 'warn' ? '!' : 'ℹ';
    modalTitle.textContent = opts.titulo || 'NanamyOS';
    modalMsg.textContent = mensaje;
    modalInput.style.display = 'none';

    modalActions.innerHTML = '';
    const btnOk = document.createElement('button');
    btnOk.className = 'modal-btn primary';
    btnOk.textContent = _t('modal.ok');
    btnOk.addEventListener('click', () => { _cerrarModal(); resolve(); });
    modalActions.appendChild(btnOk);

    modalOverlay.classList.add('show');
    setTimeout(() => btnOk.focus(), 30);
  });
}

// sysConfirm(mensaje, { titulo, tipo, textoOk, textoCancelar, peligro }) -> Promise<boolean>
function sysConfirm(mensaje, opts = {}) {
  return new Promise((resolve) => {
    modalIcon.className = 'modal-icon ' + (opts.tipo || 'warn');
    modalIcon.textContent = opts.tipo === 'error' ? '✕' : '!';
    modalTitle.textContent = opts.titulo || 'NanamyOS';
    modalMsg.textContent = mensaje;
    modalInput.style.display = 'none';

    modalActions.innerHTML = '';
    const btnCancel = document.createElement('button');
    btnCancel.className = 'modal-btn';
    btnCancel.textContent = opts.textoCancelar || _t('modal.cancel');
    btnCancel.addEventListener('click', () => { _cerrarModal(); resolve(false); });

    const btnOk = document.createElement('button');
    btnOk.className = 'modal-btn ' + (opts.peligro ? 'danger' : 'primary');
    btnOk.textContent = opts.textoOk || _t('modal.ok');
    btnOk.addEventListener('click', () => { _cerrarModal(); resolve(true); });

    modalActions.appendChild(btnCancel);
    modalActions.appendChild(btnOk);

    modalOverlay.classList.add('show');
    setTimeout(() => btnOk.focus(), 30);
  });
}

// sysPrompt(mensaje, valorInicial, { titulo }) -> Promise<string|null>
function sysPrompt(mensaje, valorInicial = '', opts = {}) {
  return new Promise((resolve) => {
    modalIcon.className = 'modal-icon info';
    modalIcon.textContent = 'ℹ';
    modalTitle.textContent = opts.titulo || 'NanamyOS';
    modalMsg.textContent = mensaje;
    modalInput.style.display = 'block';
    modalInput.value = valorInicial || '';

    modalActions.innerHTML = '';
    const btnCancel = document.createElement('button');
    btnCancel.className = 'modal-btn';
    btnCancel.textContent = _t('modal.cancel');
    btnCancel.addEventListener('click', () => { _cerrarModal(); resolve(null); });

    const btnOk = document.createElement('button');
    btnOk.className = 'modal-btn primary';
    btnOk.textContent = _t('modal.ok');
    const confirmar = () => { const v = modalInput.value; _cerrarModal(); resolve(v); };
    btnOk.addEventListener('click', confirmar);
    modalInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmar();
      if (e.key === 'Escape') { _cerrarModal(); resolve(null); }
    });

    modalActions.appendChild(btnCancel);
    modalActions.appendChild(btnOk);

    modalOverlay.classList.add('show');
    setTimeout(() => { modalInput.focus(); modalInput.select(); }, 30);
  });
}

function sysChoice(mensaje, opciones, opts = {}) {
  return new Promise((resolve) => {
    modalIcon.className = 'modal-icon info';
    modalIcon.textContent = 'ℹ';
    modalTitle.textContent = opts.titulo || 'NanamyOS';
    modalMsg.textContent = mensaje;
    modalInput.style.display = 'none';

    modalActions.innerHTML = '';
    opciones.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'modal-btn ' + (opt.clase || 'primary');
      btn.textContent = opt.texto;
      btn.onclick = () => { _cerrarModal(); resolve(opt.valor); };
      modalActions.appendChild(btn);
    });

    const btnCancel = document.createElement('button');
    btnCancel.className = 'modal-btn';
    btnCancel.textContent = _t('modal.cancel');
    btnCancel.onclick = () => { _cerrarModal(); resolve(null); };
    modalActions.appendChild(btnCancel);

    modalOverlay.classList.add('show');
  });
}

    if (r.ok) { const d = await r.json(); if (d && typeof d === 'object') uiState = d; }
  } catch(e) {}
}

  _saveTimer = setTimeout(async () => {
    try {

        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(uiState)
      });
    } catch(e) {}
  }, 600);
}

    });
  } catch(e) {}
}

let recientes = [];
function registrarReciente(nombre, isDir) {
  recientes = recientes.filter(r => r.nombre !== nombre);
  recientes.unshift({ nombre, isDir: !!isDir });
  if (recientes.length > 5) recientes.pop();
  dibujarRecientes();
}
function dibujarRecientes() {
  const c = document.getElementById('recent-list');
  if (recientes.length === 0) {
    c.innerHTML = '<div class="recent-empty">' + _t('start.recentEmpty') + '</div>';
    return;
  }
  c.innerHTML = recientes.map(r => `<div class="recent-item" data-name="${r.nombre}" data-isdir="${r.isDir}"><span class="recent-glyph">▤</span><span>${_labelDeIcono(r.nombre)}</span></div>`).join('');
  c.querySelectorAll('.recent-item').forEach(el => {
    el.addEventListener('click', () => {
      startMenu.classList.remove('show');
      abrirIconoPorNombre(el.dataset.name, el.dataset.isdir === 'true');
    });
  });
}

let zTop = 40;
const ventanasAbiertas = {}; // id -> { el, tipo, ruta }
const desktop = document.getElementById('desktop');
const taskbarWins = document.getElementById('open-windows');

function traerAlFrente(el) {
  zTop++;
  el.style.zIndex = zTop;
  // marcar chip activo
  taskbarWins.querySelectorAll('.task-chip').forEach(c => c.classList.remove('active'));
  const chip = taskbarWins.querySelector(`[data-winid="${el.dataset.winid}"]`);
  if (chip) chip.classList.add('active');
}

function crearVentana({ id, titulo, icono = '▤', ancho = 520, alto = 380, izq, arr, i18nKey }) {
  const tpl = document.getElementById('tpl-window');
  const clone = tpl.content.cloneNode(true);
  const win = clone.querySelector('.window');

  win.dataset.winid = id;
  win.querySelector('.win-title').textContent = titulo;
  if (i18nKey) {
    win.querySelector('.win-title').dataset.i18n = i18nKey;
    win.dataset.i18nTitulo = i18nKey;
  }
  win.querySelector('.win-icon').textContent = icono;
  win.querySelector('.win-maximize').title = _t('win.maximize');
  win.querySelector('.win-minimize').title = _t('win.minimize');
  win.querySelector('.win-close').title = _t('win.close');

  // posición
  const baseIzq = izq !== undefined ? izq : 100 + (Object.keys(ventanasAbiertas).length % 6) * 28;
  const baseArr = arr !== undefined ? arr : 60  + (Object.keys(ventanasAbiertas).length % 6) * 22;
  win.style.left   = baseIzq + 'px';
  win.style.top    = baseArr + 'px';
  win.style.width  = ancho   + 'px';
  win.style.height = alto    + 'px';

  desktop.appendChild(win);
  win.classList.add('show');

  // chip en taskbar
  const chip = document.createElement('button');
  chip.className = 'task-chip active';
  chip.dataset.winid = id;
  chip.innerHTML = `<span class="task-chip-label"${i18nKey ? ` data-i18n-chip="${i18nKey}" data-chip-icon="${icono}"` : ''}>${icono} ${titulo}</span><span class="task-chip-close">✕</span>`;
  function toggleMinimizado() {
    if (win.classList.contains('show')) {
      // ── minimizar: encoge y se desvanece hacia su chip en la taskbar ──
      const winRect  = win.getBoundingClientRect();
      const chipRect = chip.getBoundingClientRect();
      const dx = (chipRect.left + chipRect.width  / 2) - (winRect.left + winRect.width  / 2);
      const dy = (chipRect.top  + chipRect.height / 2) - (winRect.top  + winRect.height / 2);
      const escala = Math.max(0.05, chipRect.width / winRect.width);

      const limpiar = () => {
        win.classList.remove('show', 'anim-min');
        win.style.transform = '';
        win.style.opacity = '';
        chip.classList.remove('active');
      };

      win.classList.add('anim-min');
      win.style.transformOrigin = 'center center';
      win.style.transform = `translate(${dx}px, ${dy}px) scale(${escala})`;
      win.style.opacity = '0';
      win.addEventListener('transitionend', limpiar, { once: true });
      setTimeout(limpiar, 260); // respaldo si transitionend no dispara

    } else {
      // ── restaurar: aparece desde el chip y crece hasta su tamano/posicion normal ──
      win.style.transformOrigin = 'center center';
      win.classList.add('show'); // necesario para poder medir su rect real (left/top/width/height ya estan en su style)

      const winRect  = win.getBoundingClientRect();
      const chipRect = chip.getBoundingClientRect();
      const dx = (chipRect.left + chipRect.width  / 2) - (winRect.left + winRect.width  / 2);
      const dy = (chipRect.top  + chipRect.height / 2) - (winRect.top  + winRect.height / 2);
      const escala = Math.max(0.05, chipRect.width / winRect.width);

      // estado inicial (encogida en el chip), sin transicion para que no se anime el "salto"
      win.style.transform = `translate(${dx}px, ${dy}px) scale(${escala})`;
      win.style.opacity = '0';
      void win.offsetHeight; // fuerza reflow para que el navegador registre el estado inicial

      win.classList.add('anim-min');
      requestAnimationFrame(() => {
        win.style.transform = '';
        win.style.opacity = '';
      });

      const limpiar = () => win.classList.remove('anim-min');
      win.addEventListener('transitionend', limpiar, { once: true });
      setTimeout(limpiar, 260);

      traerAlFrente(win);
    }
  }

  chip.addEventListener('click', (e) => {
    if (e.target.classList.contains('task-chip-close')) {
      cerrarVentana(id);
    } else {
      toggleMinimizado();
    }
  });
  taskbarWins.appendChild(chip);
  traerAlFrente(win);

  // focus al hacer click en la ventana
  win.addEventListener('mousedown', () => traerAlFrente(win));

  // cerrar con X
  win.querySelector('.win-close').addEventListener('click', () => cerrarVentana(id));

  // minimizar
  win.querySelector('.win-minimize').addEventListener('click', () => toggleMinimizado());

  // maximizar
  let maximizado = false, prevState = {};
  const btnMax = win.querySelector('.win-maximize');
  const toggleMax = () => {
    win.classList.add('anim-max');
    const quitarAnim = () => win.classList.remove('anim-max');
    win.addEventListener('transitionend', quitarAnim, { once: true });
    setTimeout(quitarAnim, 260); // respaldo si transitionend no dispara (ej. ya estaba en el valor final)

    if (!maximizado) {
      prevState = { left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height };
      win.classList.add('maximized');
      btnMax.textContent = '⊡';
      maximizado = true;
    } else {
      win.classList.remove('maximized');
      Object.assign(win.style, prevState);
      btnMax.textContent = '□';
      maximizado = false;
    }
  };
  btnMax.addEventListener('click', toggleMax);
  win.querySelector('.window-titlebar').addEventListener('dblclick', (e) => {
    if (e.target.closest('.win-btn')) return;
    toggleMax();
  });

  // arrastre
  const titlebar = win.querySelector('.window-titlebar');
  let drag = false, dox = 0, doy = 0;
  titlebar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.win-btn') || maximizado) return;
    drag = true; traerAlFrente(win);
    // getBoundingClientRect devuelve coordenadas ya escaladas por el zoom CSS del <html>.
    // e.clientX/Y tambien estan en esas mismas coordenadas escaladas, asi que la resta es directa.
    // Lo que necesitamos es el offset en coordenadas LOGICAS (sin zoom) para asignarlo a style.left/top,
    // asi que dividimos por el zoom actual.
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    const r = win.getBoundingClientRect();
    dox = (e.clientX - r.left) / zoom;
    doy = (e.clientY - r.top)  / zoom;
  });
  document.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    win.style.left = (e.clientX / zoom - dox) + 'px';
    win.style.top  = (e.clientY / zoom - doy) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (drag) { drag = false; guardarEstadoVentana(id); }
  });

  // resize
  const rh = win.querySelector('.resize-handle');
  let res = false, rx = 0, ry = 0, rw = 0, rht = 0;
  rh.addEventListener('mousedown', (e) => {
    if (maximizado) return;
    e.preventDefault(); e.stopPropagation();
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    res = true; rx = e.clientX / zoom; ry = e.clientY / zoom;
    rw = win.offsetWidth; rht = win.offsetHeight;
  });
  document.addEventListener('mousemove', (e) => {
    if (!res) return;
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    win.style.width  = Math.max(280, rw  + (e.clientX / zoom - rx)) + 'px';
    win.style.height = Math.max(200, rht + (e.clientY / zoom - ry)) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (res) { res = false; guardarEstadoVentana(id); }
  });

  return win;
}

function cerrarVentana(id) {
  const info = ventanasAbiertas[id];
  if (!info) return;
  if (info._cleanup) info._cleanup();
  info.el.remove();
  const chip = taskbarWins.querySelector(`[data-winid="${id}"]`);
  if (chip) chip.remove();
  delete ventanasAbiertas[id];
}

function guardarEstadoVentana(id) {
  const info = ventanasAbiertas[id];
  if (!info || info.el.classList.contains('maximized')) return;
  const el = info.el;
  uiState.ventanas = uiState.ventanas || {};
  uiState.ventanas[id] = {
    left: el.style.left, top: el.style.top,
    width: el.style.width, height: el.style.height,
  };
  guardarEstadoUI();
}

// ══════════════════════════════════════════════════════
//  TIPOS MIME
// ══════════════════════════════════════════════════════
const MIME = {
  txt:'text/plain', log:'text/plain', json:'application/json',
  csv:'text/csv', html:'text/html', htm:'text/html',
  jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
  gif:'image/gif', bmp:'image/bmp', webp:'image/webp',
  mp4:'video/mp4', webm:'video/webm',
  mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', aac:'audio/aac',
  pdf:'application/pdf',
};

function extDe(nombre) { return nombre.split('.').pop().toLowerCase(); }

function tipoArchivo(nombre) {
  const e = extDe(nombre);
  if (e === 'lex') return 'lex';
  if (['txt','log','json','csv','md','ini','cfg','py','js','sh'].includes(e)) return 'texto';
  if (['jpg','jpeg','png','gif','bmp','webp'].includes(e)) return 'imagen';
  if (['mp4','webm','mkv'].includes(e)) return 'video';
  if (['mp3','wav','ogg','aac'].includes(e)) return 'audio';
  if (e === 'pdf') return 'pdf';
  if (['html','htm'].includes(e)) return 'html';
  return 'desconocido';
}

function urlArchivo(ruta) {
  return '/api/raw?path=' + encodeURIComponent(ruta);
}

// fuerza la descarga de un archivo de NanamyOS al dispositivo (PC/movil) que esta usando la interfaz
function descargarArchivo(ruta, nombre) {
  const a = document.createElement('a');
  a.href = urlArchivo(ruta);
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function normalizarUrl(input) {
  let url = input.trim();
  const lang = window._idioma || 'en';
  const homePath = '/api/browser-home?lang=' + lang;

  if (!url || url === '/api/browser-home') return homePath;
  // Si ya es una ruta interna de la API, devolver tal cual
  if (url.startsWith('/api/')) return url;

  // Si tiene espacios o no tiene un punto, tratar como búsqueda con Brave
  if (url.includes(' ') || !url.includes('.')) {
    return '/api/browse/https://search.brave.com/search?q=' + encodeURIComponent(url);
  }
  if (!/^https?:\/\//i.test(url)) {
    url = 'https://' + url;
  }
  return url;
}

function abrirBrowser(urlInicial) {
  if (!urlInicial) urlInicial = '/api/browser-home?lang=' + (window._idioma || 'en');
  const winId = 'browser_' + Date.now();
  const win = crearVentana({ id: winId, titulo: _t('icon.browser'), icono: '🌐', ancho: 800, alto: 600 });
  ventanasAbiertas[winId] = { el: win, tipo: 'browser' };

  const toolbar = document.createElement('div');
  toolbar.className = 'window-toolbar browser-toolbar';
  toolbar.style.cssText = 'display:flex;gap:8px;padding:8px;background:var(--bg-alt);border-bottom:1px solid var(--border);align-items:center;';

  const btnBack = document.createElement('button');
  btnBack.className = 'win-btn';
  btnBack.textContent = '←'; btnBack.title = _t('browser.back');

  const btnForward = document.createElement('button');
  btnForward.className = 'win-btn';
  btnForward.textContent = '→'; btnForward.title = _t('browser.forward');

  const btnReload = document.createElement('button');
  btnReload.className = 'win-btn';
  btnReload.textContent = '↻'; btnReload.title = _t('browser.reload');

  const inputUrl = document.createElement('input');
  inputUrl.type = 'text';
  inputUrl.value = urlInicial;
  inputUrl.style.cssText = 'flex:1;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:12px;outline:none;';

  const btnGo = document.createElement('button');
  btnGo.className = 'win-btn';
  btnGo.style.width = 'auto';
  btnGo.style.padding = '0 8px';
  btnGo.textContent = _t('browser.go');

  const btnStar = document.createElement('button');
  btnStar.className = 'win-btn browser-star-btn';
  btnStar.textContent = '⭐'; btnStar.title = _t('browser.bookmarks');

  toolbar.append(btnBack, btnForward, btnReload, inputUrl, btnGo, btnStar);

  const body = document.createElement('div');
  body.className = 'window-body viewer';
  body.style.cssText = 'display:flex;flex-direction:column;flex:1;padding:0;overflow:hidden;background:#fff;position:relative;';

  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'flex:1;width:100%;border:none;background:#fff;';
  iframe.setAttribute('allow', 'fullscreen; autoplay; picture-in-picture; clipboard-write; encrypted-media; gyroscope');
  iframe.setAttribute('allowfullscreen', 'true');

  const drop = document.createElement('div');
  drop.className = 'browser-bookmarks-dropdown';
  win.appendChild(drop);

  function renderBookmarks() {
    drop.innerHTML = '';

    globalBookmarks.forEach((b, i) => {
      const item = document.createElement('div');
      item.className = 'bookmark-item';

      const info = document.createElement('div');
      info.className = 'bookmark-info';

      const title = document.createElement('span');
      title.className = 'bookmark-title';
      title.textContent = b.title;

      const url = document.createElement('span');
      url.className = 'bookmark-url';
      url.textContent = b.url;

      info.appendChild(title);
      info.appendChild(url);
      item.appendChild(info);

      const del = document.createElement('span');
      del.className = 'bookmark-del';
      del.textContent = '✕';
      del.onclick = (e) => {
        e.stopPropagation();
        globalBookmarks.splice(i, 1);
        guardarMarcadores();
        renderBookmarks();
      };
      item.appendChild(del);

      item.onclick = (e) => {
        e.stopPropagation();
        navigate(b.url);
        drop.classList.remove('show');
      };
      drop.appendChild(item);
    });

    // Botón para añadir (al final)
    const addBtn = document.createElement('div');
    addBtn.className = 'bookmark-item';
    addBtn.style.borderTop = '1px solid var(--border)';
    addBtn.style.fontWeight = 'bold';
    addBtn.innerHTML = `<span>+ ${_t('browser.addBookmark')}</span>`;
    addBtn.onclick = async (e) => {
      e.stopPropagation();
      const choice = await sysChoice(_t('browser.addBookmark'), [
        { texto: _t('browser.addCurrent'), valor: 'current' },
        { texto: _t('browser.addCustom'), valor: 'custom' }
      ]);

      if (!choice) return;

      let targetUrl = '';
      if (choice === 'current') {
        targetUrl = inputUrl.value;
      } else {
        targetUrl = await sysPrompt(_t('browser.bookmarkUrl'), 'https://');
      }

      if (targetUrl) {
        const title = await sysPrompt(_t('browser.bookmarkTitle'), targetUrl.split('/')[2] || targetUrl);
        if (title) {
          globalBookmarks.push({ title: title, url: targetUrl });
          guardarMarcadores();
          renderBookmarks();
        }
      }
    };
    drop.appendChild(addBtn);
  }

  btnStar.onclick = (e) => {
    e.stopPropagation();
    const isShowing = drop.classList.contains('show');
    document.querySelectorAll('.browser-bookmarks-dropdown').forEach(d => d.classList.remove('show'));
    if (!isShowing) {
      renderBookmarks();
      drop.classList.add('show');
    }
  };

  win.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.browser-bookmarks-dropdown')) {
      document.querySelectorAll('.browser-bookmarks-dropdown').forEach(d => d.classList.remove('show'));
    }
  });

  function navigate(url) {
    const normalized = normalizarUrl(url);
    inputUrl.value = (normalized === '/api/browser-home') ? '' : normalized;
    iframe.src = normalized.startsWith('/api/') ? normalized : '/api/browse/' + normalized;
  }

  btnGo.onclick = () => navigate(inputUrl.value);
  inputUrl.onkeydown = (e) => { if (e.key === 'Enter') navigate(inputUrl.value); };
  btnReload.onclick = () => { iframe.src = iframe.src; };
  btnBack.onclick = () => { try { iframe.contentWindow.history.back(); } catch(e) {} };
  btnForward.onclick = () => { try { iframe.contentWindow.history.forward(); } catch(e) {} };

  iframe.onload = () => {
    try {
      const currentProxyUrl = iframe.contentWindow.location.href;
      if (currentProxyUrl.includes('/api/browser-home')) {
        inputUrl.value = '';
      } else if (currentProxyUrl.includes('/api/browse/')) {
        const realUrl = currentProxyUrl.substring(currentProxyUrl.indexOf('/api/browse/') + 12);
        if (realUrl) inputUrl.value = realUrl;
      }
    } catch(e) {}
  };

  const syncInterval = setInterval(() => {
    try {
      if (!iframe || !iframe.contentWindow) return;
      const currentProxyUrl = iframe.contentWindow.location.href;
      if (currentProxyUrl.includes('/api/browser-home')) {
        if (inputUrl.value !== '' && document.activeElement !== inputUrl) inputUrl.value = '';
      } else if (currentProxyUrl.includes('/api/browse/')) {
        const realUrl = currentProxyUrl.substring(currentProxyUrl.indexOf('/api/browse/') + 12);
        if (realUrl && inputUrl.value !== realUrl && document.activeElement !== inputUrl) {
          inputUrl.value = realUrl;
        }
      }
    } catch(e) {}
  }, 1000);

  const onMsg = (e) => {
    if (!e.data || e.source !== iframe.contentWindow) return;

    if (e.data.type === 'browser-fs') {
      toggleFS(e.data.state);
    } else if (e.data.type === 'browser-url') {
      let realUrl = e.data.url;
      if (realUrl.includes('/api/browse/')) {
        realUrl = realUrl.substring(realUrl.indexOf('/api/browse/') + 12);
      }
      if (realUrl && !realUrl.includes('/api/browser-home') && inputUrl.value !== realUrl && document.activeElement !== inputUrl) {
        inputUrl.value = realUrl;
        iframe.dataset.currentRealUrl = realUrl;
      }
    }
  };
  window.addEventListener('message', onMsg);

  const exitFSBtn = document.createElement('button');
  exitFSBtn.textContent = '✕ Exit Fullscreen';
  exitFSBtn.style.cssText = 'position:absolute;top:10px;right:10px;z-index:10001;background:rgba(0,0,0,0.6);color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:11px;display:none;';
  exitFSBtn.onclick = () => toggleFS(false);
  body.appendChild(exitFSBtn);

  function toggleFS(isFS) {
    if (isFS) {
      win.dataset.prevWidth = win.style.width;
      win.dataset.prevHeight = win.style.height;
      win.dataset.prevTop = win.style.top;
      win.dataset.prevLeft = win.style.left;
      win.classList.add('maximized', 'os-fullscreen-mode');
      exitFSBtn.style.display = 'block';
    } else {
      win.classList.remove('os-fullscreen-mode');
      exitFSBtn.style.display = 'none';
      // Restaurar si no estaba maximizado manualmente antes
      if (win.dataset.prevWidth) {
         win.style.width = win.dataset.prevWidth;
         win.style.height = win.dataset.prevHeight;
         win.style.top = win.dataset.prevTop;
         win.style.left = win.dataset.prevLeft;
         win.classList.remove('maximized');
      }
    }
  }

  win.querySelector('.win-close').addEventListener('click', () => {
    clearInterval(syncInterval);
    window.removeEventListener('message', onMsg);
  });

  body.appendChild(iframe);
  win.insertBefore(toolbar, win.querySelector('.resize-handle'));
  win.insertBefore(body, win.querySelector('.resize-handle'));

  navigate(urlInicial);
}

// ══════════════════════════════════════════════════════
//  ABRIR ARCHIVO EN VENTANA
// ══════════════════════════════════════════════════════
async function abrirArchivo(rutaCarpeta, nombre) {
  const sep   = rutaCarpeta.endsWith('/') ? '' : '/';
  const ruta  = rutaCarpeta + sep + nombre;
  const tipo  = tipoArchivo(nombre);
  const winId = 'file_' + ruta.replace(/[^a-zA-Z0-9]/g, '_');

  // si ya está abierta, traer al frente
  if (ventanasAbiertas[winId]) {
    const info = ventanasAbiertas[winId];
    info.el.classList.add('show');
    traerAlFrente(info.el);
    return;
  }

  // ── .lex: mini-apps de NanamyOS (manifiesto JSON con HTML/CSS/JS inline) ──
  // se lee y se valida ANTES de crear la ventana, porque el propio .lex
  // puede definir su nombre/icono/tamano (si no, se usan los del archivo).
  if (tipo === 'lex') {
    let manifest;
    try {
      const r = await fetch(urlArchivo(ruta));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      manifest = JSON.parse(await r.text());
    } catch (e) {
      await sysAlert(_t('lex.errorLeer', e.message), { tipo: 'error', titulo: _t('msg.tituloError') });
      return;
    }
    if (!manifest || typeof manifest.html !== 'string') {
      await sysAlert(_t('lex.errorFormato'), { tipo: 'error', titulo: _t('msg.tituloError') });
      return;
    }

    const titulo = manifest.name || nombre.replace(/\.lex$/i, '');
    const icono  = manifest.icon || '✦';
    const win = crearVentana({
      id: winId, titulo, icono,
      ancho: Number(manifest.width) || undefined,
      alto:  Number(manifest.height) || undefined,
    });
    ventanasAbiertas[winId] = { el: win, tipo: 'lex', ruta };

    const div = document.createElement('div');
    div.className = 'window-body viewer media-container';
    div.style.padding = '0';
    const iframe = document.createElement('iframe');
    // sandbox: la app corre en su propio origen aislado del DOM de NanamyOS,
    // pero puede correr su propio JS (allow-scripts), abrir popups/forms,
    // y usar localStorage/cookies persistentes propias (allow-same-origin).
    // NOTA DE SEGURIDAD: allow-scripts + allow-same-origin juntos significan
    // que una app .lex maliciosa podria intentar acceder al DOM padre. Esto
    // es aceptable solo porque las apps .lex son escritas/revisadas por el
    // propio usuario, no contenido de terceros sin confianza.
    iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals allow-same-origin');
    iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
    iframe.srcdoc = manifest.html;
    div.appendChild(iframe);
    win.insertBefore(div, win.querySelector('.resize-handle'));
    return;
  }

  const iconos = { texto:'📄', imagen:'🖼', video:'▶', audio:'♪', pdf:'📋', html:'🌐', desconocido:'▢' };
  const win = crearVentana({ id: winId, titulo: nombre, icono: iconos[tipo] || '▢' });
  ventanasAbiertas[winId] = { el: win, tipo, ruta };

  const url = urlArchivo(ruta);

  if (tipo === 'texto') {
    // ── Editor de texto ──
    const toolbar = document.createElement('div');
    toolbar.className = 'editor-toolbar';

    const status = document.createElement('span');
    status.className = 'editor-status';
    status.textContent = nombre;

    const btnGuardar = document.createElement('button');
    btnGuardar.className = 'editor-save-btn';
    btnGuardar.textContent = _t('editor.guardar');

    toolbar.appendChild(status);
    toolbar.appendChild(btnGuardar);

    const ta = document.createElement('textarea');
    ta.id = 'txt-editor-' + winId;
    ta.className = 'window-body viewer';
    ta.style.cssText = 'flex:1;width:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;border:none;outline:none;padding:14px;resize:none;line-height:1.6;user-select:text;-webkit-user-select:text;';
    ta.spellcheck = false;

    // cargar contenido
    try {
      const r = await fetch(url);
      ta.value = r.ok ? await r.text() : _t('editor.errorCargar');
    } catch(e) { ta.value = _t('editor.noConectar'); }

    btnGuardar.addEventListener('click', async () => {
      status.textContent = _t('editor.guardando');
      try {
        const r = await fetch('/api/save?path=' + encodeURIComponent(ruta), {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: ta.value
        });
        status.textContent = r.ok ? _t('editor.guardado') : _t('editor.errorGuardar');
      } catch(e) { status.textContent = _t('editor.sinConexion'); }
      setTimeout(() => { status.textContent = nombre; }, 2000);
    });

    win.insertBefore(toolbar, win.querySelector('.resize-handle'));
    win.insertBefore(ta, win.querySelector('.resize-handle'));

  } else if (tipo === 'imagen') {
    const div = document.createElement('div');
    div.className = 'window-body viewer media-container';
    const img = document.createElement('img');
    img.src = url; img.alt = nombre;
    div.appendChild(img);
    win.insertBefore(div, win.querySelector('.resize-handle'));

  } else if (tipo === 'video') {
    const div = document.createElement('div');
    div.className = 'window-body viewer media-container';
    div.style.background = '#000';
    const vid = document.createElement('video');
    vid.src = url; vid.controls = true; vid.autoplay = false;
    vid.style.maxWidth = '100%'; vid.style.maxHeight = '100%';
    div.appendChild(vid);
    win.insertBefore(div, win.querySelector('.resize-handle'));

  } else if (tipo === 'audio') {
    const div = document.createElement('div');
    div.className = 'window-body viewer media-container';
    div.style.flexDirection = 'column'; div.style.gap = '12px';
    const lbl = document.createElement('div');
    lbl.style.cssText = 'color:var(--subtext);font-size:12px;';
    lbl.textContent = nombre;
    const aud = document.createElement('audio');
    aud.src = url; aud.controls = true; aud.autoplay = false;
    aud.style.width = '90%';
    div.appendChild(lbl); div.appendChild(aud);
    win.insertBefore(div, win.querySelector('.resize-handle'));

  } else if (tipo === 'pdf' || tipo === 'html') {
    const div = document.createElement('div');
    div.className = 'window-body viewer media-container';
    div.style.padding = '0';
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.cssText = 'width:100%;height:100%;border:none;';
    div.appendChild(iframe);
    win.insertBefore(div, win.querySelector('.resize-handle'));

  } else {
    // descarga directa
    const a = document.createElement('a');
    a.href = url; a.download = nombre; a.click();
    cerrarVentana(winId);
    return;
  }
}

// ══════════════════════════════════════════════════════
//  ESCRITORIO SIMULADO: fusiona "/" con "/Desktop"
// ══════════════════════════════════════════════════════
async function listarFusionRaizYDesktop() {
  const resultado = [];

  async function listar(ruta) {
    try {
      const r = await fetch('/api/files?path=' + encodeURIComponent(ruta));
      if (!r.ok) return [];
      const data = await r.json();
      return (data.items || []).map(it => ({ ...it, origen: ruta }));
    } catch(e) { return []; }
  }

  const [raiz, desktop] = await Promise.all([listar('/'), listar('/Desktop')]);

  // de la raiz, excluimos la carpeta "Desktop" misma para no listarla dos veces
  raiz.forEach(it => {
    if (it.isDir && it.name === 'Desktop') return;
    resultado.push(it);
  });
  desktop.forEach(it => resultado.push(it));

  return resultado;
}

async function abrirExplorador(rutaInicial, tituloInicial) {
  const winId = 'explorer_' + Date.now();

  const toolbar = document.createElement('div');
  toolbar.className = 'window-toolbar';

  const btnBack = document.createElement('button');
  btnBack.className = 'win-back'; btnBack.textContent = '←'; btnBack.disabled = true;

  const pathSpan = document.createElement('span');
  pathSpan.className = 'win-path'; pathSpan.textContent = rutaInicial;

  const btnUpload = document.createElement('button');
  btnUpload.className = 'win-upload'; btnUpload.textContent = '⇧'; btnUpload.title = _t('fs.subir') || 'Subir archivo';

  const inputUpload = document.createElement('input');
  inputUpload.type = 'file';
  inputUpload.multiple = true;
  inputUpload.style.display = 'none';

  btnUpload.addEventListener('click', () => inputUpload.click());
  inputUpload.addEventListener('change', async () => {
    const archivos = Array.from(inputUpload.files || []);

    if (!archivos.length) return;

    await subirEntradas(entradas, rutaActual);
