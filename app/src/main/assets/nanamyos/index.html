  const body = document.createElement('div');
  body.className = 'window-body';

  win.insertBefore(toolbar, win.querySelector('.resize-handle'));
  win.insertBefore(body,    win.querySelector('.resize-handle'));

  let historial = [];
  let rutaActual = rutaInicial;

  async function cargarCarpeta(ruta, addHistory) {
    body.innerHTML = '<div class="fs-empty">' + _t('fs.loading') + '</div>';
    pathSpan.textContent = ruta;
    win.querySelector('.win-title').textContent = (ruta === '/Home' || ruta === '/') ? _t('fs.home') : ruta.split('/').filter(Boolean).pop();

    if (addHistory && rutaActual !== ruta) historial.push(rutaActual);
    rutaActual = ruta;
    ventanasAbiertas[winId].ruta = ruta;
    btnBack.disabled = historial.length === 0;
    body.dataset.focuspath = ruta; // el fondo de esta ventana enfoca "ruta" mientras el mouse este sobre el

    try {
      const r = await fetch('/api/files?path=' + encodeURIComponent(ruta));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      let items = (data.items || []).map(it => ({ ...it, origen: ruta }));

      if (!items || items.length === 0) {
        body.innerHTML = '<div class="fs-empty">' + _t('fs.empty') + '</div>'; return;
      }

      items = items.slice().sort((a,b) => {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      body.innerHTML = items.map(it => {
        const sep = it.origen.endsWith('/') ? '' : '/';
        const fullPath = it.origen + sep + it.name;
        return `
        <div class="fs-item ${it.isDir ? 'is-dir' : 'is-file'}" data-name="${it.name}" data-isdir="${it.isDir}" data-origen="${it.origen}"${it.isDir ? ` data-focuspath="${fullPath}"` : ''}>
          <div class="fs-glyph">${it.isDir ? '▤' : glifoDe(it.name)}</div>
          <div class="fs-name">${it.name}</div>
        </div>`;
      }).join('');

      body.querySelectorAll('.fs-item').forEach(el => {
        const origenItem = el.dataset.origen;
        const sep = origenItem.endsWith('/') ? '' : '/';
        const fullPath = origenItem + sep + el.dataset.name;

        el.addEventListener('dblclick', () => {
          if (fsItemMovido) return; // evita abrir justo despues de soltar un arrastre
          if (el.dataset.isdir === 'true') {
            cargarCarpeta(fullPath, true);
          } else {
            abrirArchivo(origenItem, el.dataset.name);
          }
        });

        el.addEventListener('contextmenu', (e) => {
          e.preventDefault(); e.stopPropagation();
          menuItem(e.pageX, e.pageY, { name: el.dataset.name, isDir: el.dataset.isdir === 'true', fullPath },
                   () => cargarCarpeta(rutaActual, false));
        });

        el.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return; // solo click izquierdo
          iniciarArrastreFS(el, {
            nombre: el.dataset.name,
            isDir: el.dataset.isdir === 'true',
            origen: origenItem,
            fullPath,
          }, e);
        });
      });

    } catch(e) {
      body.innerHTML = `<div class="fs-error">No se pudo conectar.<br>${e.message}</div>`;
    }
  }

  body.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.fs-item')) return; // ya lo maneja el listener del item
    e.preventDefault();
    e.stopPropagation(); // CLAVE: evita que el menu del Escritorio real sobreescriba este
    // crear/pegar siempre va a la carpeta que estamos viendo realmente (incluida "/")
    menuFondo(e.pageX, e.pageY, rutaActual, () => cargarCarpeta(rutaActual, false));
  });

  ventanasAbiertas[winId].refrescar = () => cargarCarpeta(rutaActual, false);

  btnBack.addEventListener('click', () => {
    if (!historial.length) return;
    const prev = historial.pop();
    cargarCarpeta(prev, false);
  });

  cargarCarpeta(rutaInicial, false);
}

function glifoDe(nombre) {
  const t = tipoArchivo(nombre);
  return { texto:'📄', imagen:'🖼', video:'▶', audio:'♪', pdf:'📋', html:'🌐', lex:'✦' }[t] || '▢';
}

// ══════════════════════════════════════════════════════
//  ICONOS DEL ESCRITORIO (fijos + dinamicos desde /Desktop)
// ══════════════════════════════════════════════════════
const iconGrid = document.getElementById('icon-grid');
// CELDA_W/H se calculan dinamicamente segun la escala de iconos actual
function _getCeldaW() { return Math.round(120 * (window._iconScaleFactor || 1)); }
function _getCeldaH() { return Math.round(125 * (window._iconScaleFactor || 1)); }

// iconos fijos: siempre presentes, no vienen de la SD
const ICONOS_FIJOS = [
  { name: 'Home',       glyph: '⌂', clase: 'folder', ruta: '/Home' },
  { name: 'Browser',    glyph: '🌐', clase: 'app',    ruta: 'browser' },
  { name: 'Config',     glyph: '⚙', clase: 'app',    ruta: '/config' },
];

const RUTAS_ICONO = {}; // se llena dinamicamente con fijos + items de /Desktop

let iconoArrastrado = null, offX = 0, offY = 0, celdaOrigen = null, iconoMovido = false;
const ocupacion = {};

const COLS_GRID = 6;

function celdaDe(c, f) { return c + ',' + f; }
function colFilaDesdeXY(x, y) {
  const W = _getCeldaW(), H = _getCeldaH();
  let col = Math.round(x / W);
  col = Math.max(0, Math.min(COLS_GRID - 1, col));
  const fila = Math.max(0, Math.round(y / H));
  return { col, fila };
}

// busca la primera celda NO ocupada, recorriendo columna por columna
// (columna 0 de arriba a abajo primero, asi se respeta el orden vertical por defecto)
function siguienteCeldaLibre() {
  const H = _getCeldaH();
  const maxFilas = Math.max(4, Math.floor((iconGrid.clientHeight || 600) / H));
  for (let col = 0; col < COLS_GRID; col++) {
    for (let fila = 0; fila < maxFilas; fila++) {
      if (!ocupacion[celdaDe(col, fila)]) return { col, fila };
    }
  }
  let fila = maxFilas;
  while (ocupacion[celdaDe(COLS_GRID - 1, fila)]) fila++;
  return { col: COLS_GRID - 1, fila };
}

function posicionarIcono(icono, col, fila, animar) {
  const W = _getCeldaW(), H = _getCeldaH();
  icono.dataset.col  = col;
  icono.dataset.fila = fila;
  icono.style.transition = animar ? 'left 120ms ease, top 120ms ease' : 'none';
  icono.style.left = (col * W) + 'px';
  icono.style.top  = (fila * H) + 'px';
  ocupacion[celdaDe(col, fila)] = icono;
}

function guardarPosicionesIconos() {
  uiState.iconos = {};
  iconGrid.querySelectorAll('.icon').forEach(ic => {
    uiState.iconos[ic.dataset.name] = { col: +ic.dataset.col, fila: +ic.dataset.fila };
  });
  guardarEstadoUI();
}

// nombres internos (claves, NO se traducen) -> clave de traducción para mostrar
const _ICON_LABEL_KEYS = { 'Home': 'icon.home', 'Config': 'icon.config', 'Papelera': 'icon.papelera', 'Browser': 'icon.browser' };
function _labelDeIcono(name) {
  const key = _ICON_LABEL_KEYS[name];
  return key ? _t(key) : name;
}

function crearElementoIcono({ name, glyph, clase, isDir, ruta }) {
  const div = document.createElement('div');
  div.className = 'icon';
  div.dataset.name = name;
  if (isDir && ruta) div.dataset.focuspath = ruta; // hover aqui enfoca esta carpeta especifica
  div.innerHTML = `
    <div class="icon-glyph ${clase}">${glyph}</div>
    <div class="icon-label">${_labelDeIcono(name)}</div>`;
  adjuntarEventosIcono(div, { isDir });
  return div;
}

function abrirIconoPorNombre(nombre, isDir) {
  if (nombre === 'Papelera') return;
  // Navegador
  if (nombre === 'Browser') {
    abrirBrowser();
    return;
  }
  // intercept special apps
  if (window._interceptarIcono && window._interceptarIcono(nombre)) return;
  const ruta = RUTAS_ICONO[nombre];
  if (ruta) {
    if (isDir || (ICONOS_FIJOS.some(f => f.name === nombre))) {
      abrirExplorador(ruta.endsWith('/') ? ruta.replace(/\/$/, '') || '/' : ruta, _labelDeIcono(nombre));
    } else {
      const partes = ruta.split('/');
      const archivo = partes.pop();
      const carpeta = partes.join('/') || '/';
      abrirArchivo(carpeta, archivo);
    }
  }
}

function adjuntarEventosIcono(icono, { isDir } = {}) {
  icono.addEventListener('click', () => {
    iconGrid.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
    icono.classList.add('selected');
  });

  icono.addEventListener('dblclick', () => {
    if (iconoMovido) return;
    const nombre = icono.dataset.name;
    registrarReciente(nombre, isDir || ICONOS_FIJOS.some(f => f.name === nombre));
    abrirIconoPorNombre(nombre, isDir);
  });

  icono.addEventListener('contextmenu', (e) => {
    e.preventDefault(); e.stopPropagation();
    const nombre = icono.dataset.name;
    if (ICONOS_FIJOS.some(f => f.name === nombre) || nombre === 'Papelera') return; // los fijos no se editan
    const fullPath = rutaUnir('/Desktop', nombre);
    menuItem(e.pageX, e.pageY, { name: nombre, isDir: !!isDir, fullPath }, () => refrescarEscritorio());
  });

  icono.addEventListener('mousedown', (e) => {
    iconoArrastrado = icono; iconoMovido = false;
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    const r = icono.getBoundingClientRect();
    offX = (e.clientX - r.left) / zoom; offY = (e.clientY - r.top) / zoom;
    celdaOrigen = { col: +icono.dataset.col, fila: +icono.dataset.fila };
    icono.style.transition = 'none'; icono.style.zIndex = 999998; // por encima de cualquier ventana mientras se arrastra
  });
}

// reconstruye la grid completa: fijos + Papelera + contenido real de /Desktop
async function refrescarEscritorio() {
  let itemsDesktop = [];
  try {
    const r = await fetch('/api/files?path=' + encodeURIComponent('/Desktop'));
    if (r.ok) {
      const data = await r.json();
      itemsDesktop = data.items || [];
    }
  } catch(e) { /* SD no disponible, mostramos solo los fijos */ }

  iconGrid.innerHTML = '';
  for (const k in RUTAS_ICONO) delete RUTAS_ICONO[k];
  for (const k in ocupacion) delete ocupacion[k];

  const definiciones = [];

  ICONOS_FIJOS.forEach(f => {
    RUTAS_ICONO[f.name] = f.ruta;
    definiciones.push({ name: f.name, glyph: f.glyph, clase: f.clase, isDir: true, ruta: f.ruta });
  });

  itemsDesktop
    .slice()
    .sort((a,b) => { if (a.isDir !== b.isDir) return a.isDir ? -1 : 1; return a.name.localeCompare(b.name); })
    .forEach(it => {
      const rutaItem = rutaUnir('/Desktop', it.name);
      RUTAS_ICONO[it.name] = rutaItem;
      definiciones.push({
        name: it.name,
        glyph: it.isDir ? '▤' : glifoDe(it.name),
        clase: it.isDir ? 'folder' : 'app',
        isDir: it.isDir,
        ruta: rutaItem,
      });
    });

  RUTAS_ICONO['Papelera'] = null;
  definiciones.push({ name: 'Papelera', glyph: '🗑', clase: 'trash', isDir: false });

  // creamos todos los elementos primero, sin posicionar
  const pendientes = definiciones.map(def => {
    const el = crearElementoIcono(def);
    iconGrid.appendChild(el);
    return { el, def };
  });

  // 1ra pasada: los que tienen posicion guardada, se respeta tal cual (llena 'ocupacion')
  pendientes.forEach(({ el, def }) => {
    if (uiState.iconos && uiState.iconos[def.name]) {
      const { col, fila } = uiState.iconos[def.name];
      posicionarIcono(el, col, fila, false);
    }
  });

  // 2da pasada: los que NO tienen posicion guardada (nuevos), van a la primera celda
  // realmente libre -- asi nunca se superponen con uno ya existente
  pendientes.forEach(({ el, def }) => {
    if (!(uiState.iconos && uiState.iconos[def.name])) {
      const libre = siguienteCeldaLibre();
      posicionarIcono(el, libre.col, libre.fila, false);
    }
  });
}

function inicializarIconos() {
  refrescarEscritorio();
}

document.addEventListener('mousemove', (e) => {
  if (!iconoArrastrado) return;
  iconoMovido = true;
  arrastrandoAlgo = true;
  iconoArrastrado.classList.add('dragging');
  const zoom = parseFloat(document.documentElement.style.zoom) || 1;
  const gr = iconGrid.getBoundingClientRect();
  iconoArrastrado.style.left = (e.clientX / zoom - gr.left / zoom - offX) + 'px';
  iconoArrastrado.style.top  = (e.clientY / zoom - gr.top  / zoom - offY) + 'px';
});

document.addEventListener('mouseup', async () => {
  if (!iconoArrastrado) return;
  const icono = iconoArrastrado;
  icono.classList.remove('dragging');
  icono.style.zIndex = '';
  arrastrandoAlgo = false;
  limpiarResaltadoDestino();

  if (iconoMovido) {
    const nombre   = icono.dataset.name;
    const esFijo   = ICONOS_FIJOS.some(f => f.name === nombre) || nombre === 'Papelera';
    const origenPath = RUTAS_ICONO[nombre];
    const destino  = carpetaEnfocada;

    // ¿se solto sobre una carpeta DISTINTA a donde ya esta el item? -> mover de verdad, como en Windows
    if (!esFijo && destino && destino !== '/Desktop' && destino !== origenPath) {
      try {
        const dst = rutaUnir(destino, nombre);
        const r = await fetch(`/api/move?src=${encodeURIComponent(origenPath)}&dst=${encodeURIComponent(dst)}`, { method: 'POST' });
        if (!r.ok) await sysAlert(_t('msg.noMover', nombre, r.status), { tipo: 'error', titulo: _t('msg.tituloError') });
      } catch(e) {
        await sysAlert(_t('msg.noConectar'), { tipo: 'error', titulo: _t('msg.tituloSinConexion') });
      }
      delete ocupacion[celdaDe(celdaOrigen.col, celdaOrigen.fila)];
      refrescarVistaDeCarpeta(destino);
      refrescarEscritorio();
    } else {
      // se solto en el fondo del escritorio: solo reordenar la grilla (comportamiento original)
      const x = parseFloat(icono.style.left);
      const y = parseFloat(icono.style.top);
      const dest = colFilaDesdeXY(x, y);
      const clave = celdaDe(dest.col, dest.fila);
      const ocupante = ocupacion[clave];

      if (ocupante && ocupante !== icono) {
        posicionarIcono(ocupante, celdaOrigen.col, celdaOrigen.fila, true);
      } else if (!ocupante) {
        delete ocupacion[celdaDe(celdaOrigen.col, celdaOrigen.fila)];
      }
      posicionarIcono(icono, dest.col, dest.fila, true);
      guardarPosicionesIconos();
    }
  }

  iconoArrastrado = null; celdaOrigen = null;
  setTimeout(() => { iconoMovido = false; }, 50);
});

// ══════════════════════════════════════════════════════
//  CONTEXT MENU — dinamico, con portapapeles
// ══════════════════════════════════════════════════════
const ctxMenu = document.getElementById('ctx-menu');
let portapapeles = null; // { modo:'copiar'|'cortar', ruta, nombre, isDir }

// ══════════════════════════════════════════════════════
//  CARPETA ENFOCADA — vive solo en RAM, como en Windows:
//  la carpeta sobre la que esta el mouse en este instante es
//  la que recibe los "Pegar" / "Nuevo archivo" / "Nueva carpeta"
//  hechos por teclado (Ctrl+V, etc). Si el mouse no esta sobre
//  ninguna carpeta reconocida, cae por defecto al Escritorio.
// ══════════════════════════════════════════════════════
const FOCUS_DEFECTO = '/Desktop';
let carpetaEnfocada = FOCUS_DEFECTO;

// true mientras se esta arrastrando un icono del escritorio o un fs-item de un explorador
// (lo activan icono.mousedown/fs-item.mousedown una vez que el mouse se mueve lo suficiente)
let arrastrandoAlgo = false;
let elementoResaltado = null;

function limpiarResaltadoDestino() {
  if (elementoResaltado) elementoResaltado.classList.remove('drop-target');
  elementoResaltado = null;
}

// delegado: en cada movimiento de mouse, busca el elemento con
// data-focuspath mas cercano (el mas especifico: un fs-item carpeta
// o icono carpeta gana sobre el fondo de la ventana/escritorio que lo contiene)
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-focuspath]');
  carpetaEnfocada = el ? el.dataset.focuspath : FOCUS_DEFECTO;

  if (arrastrandoAlgo) {
    if (elementoResaltado !== el) {
      limpiarResaltadoDestino();
      if (el) { el.classList.add('drop-target'); elementoResaltado = el; }
    }
  }
});
// si el mouse sale por completo de la ventana del navegador, vuelve al default
document.addEventListener('mouseleave', () => { carpetaEnfocada = FOCUS_DEFECTO; });

// refresca la vista (ventana de explorador enfocada si existe, y siempre el escritorio real)
function refrescarVistaDeCarpeta(ruta) {
  for (const id in ventanasAbiertas) {
    const info = ventanasAbiertas[id];
    if (info.tipo === 'explorador' && info.ruta === ruta && info.refrescar) info.refrescar();
  }
  refrescarEscritorio();
}

// ══════════════════════════════════════════════════════
//  ARRASTRAR ARCHIVOS/CARPETAS DENTRO DE UN EXPLORADOR
//  (mover de verdad a otra carpeta o al escritorio, como en Windows)
// ══════════════════════════════════════════════════════
let arrastreFS = null;     // { nombre, isDir, origen, fullPath }
let fsDragGhost = null;
let fsDragInicio = null;   // { x, y } punto donde se hizo mousedown, para medir el umbral
let fsItemMovido = false;  // true una vez que el arrastre superó el umbral (evita abrir por dblclick al soltar)

function iniciarArrastreFS(el, info, ev) {
  arrastreFS = info;
  fsItemMovido = false;
  fsDragInicio = { x: ev.clientX, y: ev.clientY };
  arrastreFS._glyphHtml = el.querySelector('.fs-glyph') ? el.querySelector('.fs-glyph').innerHTML : (info.isDir ? '▤' : '▢');
}

document.addEventListener('mousemove', (e) => {
  if (!arrastreFS) return;
  const dx = e.clientX - fsDragInicio.x, dy = e.clientY - fsDragInicio.y;

  if (!fsItemMovido && Math.hypot(dx, dy) > 6) {
    fsItemMovido = true;
    arrastrandoAlgo = true;
    fsDragGhost = document.createElement('div');
    fsDragGhost.className = 'fs-drag-ghost';
    fsDragGhost.innerHTML = `<div class="fs-glyph">${arrastreFS._glyphHtml}</div><div class="fs-name">${arrastreFS.nombre}</div>`;
    document.body.appendChild(fsDragGhost);
  }

  if (fsItemMovido && fsDragGhost) {
    fsDragGhost.style.left = e.clientX + 'px';
    fsDragGhost.style.top  = e.clientY + 'px';
  }
});

document.addEventListener('mouseup', async () => {
  if (!arrastreFS) return;
  const info = arrastreFS;
  arrastrandoAlgo = false;
  limpiarResaltadoDestino();
  if (fsDragGhost) { fsDragGhost.remove(); fsDragGhost = null; }

  if (fsItemMovido) {
    const destino = carpetaEnfocada;
    const rutaSinSlash = info.fullPath.endsWith('/') ? info.fullPath.slice(0, -1) : info.fullPath;
    const esMismoSitio = destino === info.origen;
    const esASiMismaOSubcarpeta = info.isDir && (destino === rutaSinSlash || destino.startsWith(rutaSinSlash + '/'));

    if (!esMismoSitio && !esASiMismaOSubcarpeta) {
      try {
        const dst = rutaUnir(destino, info.nombre);
        const r = await fetch(`/api/move?src=${encodeURIComponent(info.fullPath)}&dst=${encodeURIComponent(dst)}`, { method: 'POST' });
        if (!r.ok) await sysAlert(_t('msg.noMover', info.nombre, r.status), { tipo: 'error', titulo: _t('msg.tituloError') });
      } catch(e) {
        await sysAlert(_t('msg.noConectar'), { tipo: 'error', titulo: _t('msg.tituloSinConexion') });
      }
      refrescarVistaDeCarpeta(info.origen);
      refrescarVistaDeCarpeta(destino);
    }
  }

  arrastreFS = null;
  setTimeout(() => { fsItemMovido = false; }, 50);
});

// ══════════════════════════════════════════════════════
//  ARRASTRAR ARCHIVOS/CARPETAS DESDE EL PC (Windows/Linux/Mac)
//  hacia el navegador, para SUBIRLOS a NanamyOS.
//  Usa el mismo mecanismo de "carpetaEnfocada" / resaltado
//  [data-focuspath].drop-target que ya usa el arrastre interno,
//  asi que cae exactamente en la carpeta/ventana/escritorio
//  que esta marcada en pantalla en ese instante.
// ══════════════════════════════════════════════════════
const osDropOverlay   = document.getElementById('os-drop-overlay');
const osDropTargetName = document.getElementById('os-drop-target-name');
const uploadToast      = document.getElementById('upload-toast');
const uploadToastLabel = document.getElementById('upload-toast-label');
const uploadToastFill  = document.getElementById('upload-toast-fill');

let osDragDepth = 0; // contador de dragenter/dragleave (los hijos disparan leave/enter al navegar el arbol del DOM)

// true si el evento de arrastre viene de fuera de la pagina (drag nativo del SO).
// Nuestro propio drag interno de iconos/fs-items NO usa la API nativa de Drag&Drop del
// navegador (es manual, con mousedown/mousemove), asi que cualquier evento dragenter/
// dragover/drop que llegue aqui es, en la practica, siempre del sistema operativo.
// En Linux (GTK/Nautilus, Wayland, etc.) el dataTransfer muchas veces NO incluye el tipo
// "Files" hasta el momento exacto del drop (en dragenter/dragover solo trae "text/uri-list"
// u otros), asi que NO podemos exigir 'Files' de antemano o el drag nunca arranca.
function esDragDeArchivosDelSO(e) {
  return !!(e.dataTransfer);
}

function actualizarNombreDestinoOverlay() {
  osDropTargetName.textContent = carpetaEnfocada || FOCUS_DEFECTO;
}

window.addEventListener('dragenter', (e) => {
  if (!esDragDeArchivosDelSO(e)) return;
  e.preventDefault();
  osDragDepth++;
  osDropOverlay.classList.add('show');
  actualizarNombreDestinoOverlay();
});

window.addEventListener('dragover', (e) => {
  if (!esDragDeArchivosDelSO(e)) return;
  e.preventDefault(); // imprescindible: si no, el navegador abre el archivo en vez de soltar
  e.dataTransfer.dropEffect = 'copy';

  // reusa el mismo "foco" que el resto del sistema: el elemento [data-focuspath]
  // mas especifico bajo el cursor (fs-item carpeta > icono carpeta > fondo de ventana/escritorio)
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const focoEl = el ? el.closest('[data-focuspath]') : null;
  carpetaEnfocada = focoEl ? focoEl.dataset.focuspath : FOCUS_DEFECTO;

  if (elementoResaltado !== focoEl) {
    limpiarResaltadoDestino();
    if (focoEl) { focoEl.classList.add('drop-target'); elementoResaltado = focoEl; }
  }
  actualizarNombreDestinoOverlay();
});

  refrescarVistaDeCarpeta(destino);

// ── lee los items soltados, incluyendo carpetas completas (vía webkitGetAsEntry) ──
function leerEntradasDataTransfer(dataTransfer) {
  const items = dataTransfer.items;
  const promesas = [];

  if (items && items.length && items[0].webkitGetAsEntry) {
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
      if (entry) {
        promesas.push(recorrerEntry(entry, ''));
      } else if (items[i].getAsFile) {
        // en algunos navegadores/file-managers de Linux, webkitGetAsEntry()
        // devuelve null aunque el item si sea un archivo real: usamos getAsFile() como respaldo
        const f = items[i].getAsFile();
        if (f) promesas.push(Promise.resolve([{ file: f, relPath: f.name }]));
      }
    }
    return Promise.all(promesas).then(arrs => arrs.flat());
  }

  // fallback: navegadores sin soporte de entries, solo archivos sueltos (sin carpetas)
  const archivos = Array.from(dataTransfer.files || []);
  return Promise.resolve(archivos.map(f => ({ file: f, relPath: f.name })));
}

// recorre recursivamente un FileSystemEntry (archivo o carpeta) y devuelve
// una lista plana de { file, relPath } donde relPath conserva la subcarpeta
function recorrerEntry(entry, prefijo) {
  return new Promise((resolve) => {
    if (entry.isFile) {
      entry.file(file => resolve([{ file, relPath: prefijo + entry.name }]));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const todos = [];
      function leerLote() {
        reader.readEntries(async (lote) => {
          if (!lote.length) {
            resolve(todos);
            return;
          }
          for (const sub of lote) {
            const r = await recorrerEntry(sub, prefijo + entry.name + '/');
            todos.push(...r);
          }
          leerLote(); // readEntries puede devolver en varios lotes, hay que seguir pidiendo
        });
      }
      leerLote();
    } else {
      resolve([]);
    }
  });
}

// ── sube la lista de { file, relPath } a la carpeta destino, una por una,
//    mostrando progreso en el toast inferior ──
async function subirEntradas(entradas, destino) {
  uploadToast.classList.add('show');
  let fallos = 0;

  for (let i = 0; i < entradas.length; i++) {
    const { file, relPath } = entradas[i];
    uploadToastLabel.textContent = _t('msg.subiendo', i + 1, entradas.length, relPath);
    uploadToastFill.style.width = Math.round((i / entradas.length) * 100) + '%';

    try {
      const destinoPath = rutaUnir(destino, relPath);
      const fd = new FormData();
      fd.append('path', destinoPath);
      fd.append('file', file, file.name);
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      if (!r.ok) {
        fallos++;
        await sysAlert(_t('msg.noSubir', relPath, r.status), { tipo: 'error', titulo: _t('msg.tituloError') });
      }
    } catch (e) {
      fallos++;
      await sysAlert(_t('msg.noConectar'), { tipo: 'error', titulo: _t('msg.tituloSinConexion') });
      break; // si se perdio la conexion, no insistir con el resto de la cola
    }
  }

  uploadToastFill.style.width = '100%';
  setTimeout(() => { uploadToast.classList.remove('show'); }, 400);
}

document.addEventListener('keydown', async (e) => {
  // ignorar atajos mientras se escribe en un input/textarea (editor de texto, modales, prompts)
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (!(e.ctrlKey || e.metaKey)) return;

  const k = e.key.toLowerCase();
  if (k !== 'c' && k !== 'x' && k !== 'v') return;

  const icono = iconGrid.querySelector('.icon.selected');
  e.preventDefault();

  if (k === 'v') {
    if (!portapapeles) return;
    await pegarEn(carpetaEnfocada);
    refrescarVistaDeCarpeta(carpetaEnfocada);
    return;
  }

  // copiar / cortar via teclado: necesita un icono seleccionado en el escritorio real
  if (!icono) return;
  const nombre = icono.dataset.name;
  if (nombre === 'Papelera' || ICONOS_FIJOS.some(f => f.name === nombre)) return;
  const fullPath = rutaUnir('/Desktop', nombre);
  portapapeles = { modo: k === 'c' ? 'copiar' : 'cortar', ruta: fullPath, nombre, isDir: RUTAS_ICONO[nombre] !== undefined };
});

function mostrarCtxMenuGenerico(x, y, items) {
  ctxMenu.innerHTML = items.map((it, idx) =>
    it.sep ? `<div class="ctx-sep"></div>`
           : `<div class="ctx-item${it.peligro ? ' ctx-item-danger' : ''}" data-idx="${idx}">${it.label}</div>`
  ).join('');

  // x/y vienen de e.pageX/pageY que son coords visuales (ya escaladas por el zoom del <html>).
  // style.left/top son coords logicas (sin zoom), asi que hay que dividir por el zoom.
  const zoom = parseFloat(document.documentElement.style.zoom) || 1;
  const lx = x / zoom, ly = y / zoom;
  ctxMenu.style.left = lx + 'px';
  ctxMenu.style.top  = ly + 'px';
  ctxMenu.classList.add('show');
  const r = ctxMenu.getBoundingClientRect();
  // getBoundingClientRect devuelve coords visuales, compararlas con innerWidth/Height (tambien visuales)
  if (r.right  > window.innerWidth)  ctxMenu.style.left = Math.max(4, (window.innerWidth  - r.width)  / zoom - 4) + 'px';
  if (r.bottom > window.innerHeight) ctxMenu.style.top  = Math.max(4, (window.innerHeight - r.height) / zoom - 4) + 'px';

  ctxMenu.querySelectorAll('.ctx-item').forEach(elI => {
    elI.addEventListener('click', () => {
      const idx = +elI.dataset.idx;
      ctxMenu.classList.remove('show');
      if (items[idx].accion) items[idx].accion();
    });
  });
}

function rutaUnir(carpeta, nombre) {
  return carpeta + (carpeta.endsWith('/') ? '' : '/') + nombre;
}

function refrescarTodo(refrescar) {
  refrescar && refrescar();

// ejecuta el pegado del portapapeles en rutaDestinoCarpeta
async function pegarEn(rutaDestinoCarpeta) {
  if (!portapapeles) return;
  const dest = rutaUnir(rutaDestinoCarpeta, portapapeles.nombre);
  const endpoint = portapapeles.modo === 'copiar' ? '/api/copy' : '/api/move';
  try {
    const r = await fetch(`${endpoint}?src=${encodeURIComponent(portapapeles.ruta)}&dst=${encodeURIComponent(dest)}`, { method: 'POST' });
    if (!r.ok) {
      const accionTxt = portapapeles.modo === 'copiar' ? _t('msg.copiar') : _t('msg.mover');
      await sysAlert(_t('msg.noCopiarMover', accionTxt, portapapeles.nombre, r.status), { tipo: 'error', titulo: _t('msg.tituloError') });
      return;
    }
  } catch(e) {
    await sysAlert(_t('msg.noConectar'), { tipo: 'error', titulo: _t('msg.tituloSinConexion') });
    return;
  }
  if (portapapeles.modo === 'cortar') portapapeles = null;
}

// Helper: fila con slider
function crearRowSlider(titulo, sub, min, max, valor, onChange) {
  const row = document.createElement('div');
  row.className = 'settings-row';

  const lbl = document.createElement('div');
  lbl.className = 'settings-row-label';
  lbl.innerHTML = `${titulo}<div class="settings-row-sub">${sub}</div>`;

  const val = document.createElement('div');
  val.className = 'settings-value';
  val.textContent = valor;

  const sl = document.createElement('input');
  sl.type = 'range';
  sl.className = 'settings-slider';
  sl.min = min; sl.max = max; sl.value = valor;

  let debTimer = null;
  sl.addEventListener('input', () => {
    val.textContent = sl.value;
    clearTimeout(debTimer);
    debTimer = setTimeout(() => onChange(sl.value), 250);
  });

  row.appendChild(lbl);
  row.appendChild(val);
  row.appendChild(sl);
  return row;
}

// ══════════════════════════════════════════════════════
//  MODO MÓVIL — detección automática por aspect ratio
//  Activa cuando: ancho < alto (portrait) O ratio < 0.75
//  Desactiva cuando: ratio > 0.85 (landscape con espacio)
//  También bloquea drag/resize de ventanas en móvil.
// ══════════════════════════════════════════════════════
(function() {
  const UMBRAL_ACTIVAR   = 0.75;  // ratio w/h para activar móvil
  const UMBRAL_DESACTIVAR = 0.90; // ratio w/h para volver a PC

  let modoMovil = false;

  function aplicarModoMovil(activar) {
    if (activar === modoMovil) return;
    modoMovil = activar;
    document.body.classList.toggle('mobile', activar);

    if (activar) {
      // En móvil: todas las ventanas abiertas se maximizan
      document.querySelectorAll('.window.show').forEach(win => {
        win.classList.add('maximized');
      });
      // Iconos del escritorio: forzar escala grande
      aplicarEscalaIconos(1.5);
    } else {
      // Al volver a PC: restaurar ventanas (quitar maximized forzado)
      document.querySelectorAll('.window.maximized').forEach(win => {
        win.classList.remove('maximized');
      });
      // Restaurar escala de iconos guardada
      aplicarEscalaIconos(_getEscalaIconos());
    }
  }

  function detectar() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ratio = w / h;
    if (!modoMovil && ratio < UMBRAL_ACTIVAR)   aplicarModoMovil(true);
    if (modoMovil  && ratio > UMBRAL_DESACTIVAR) aplicarModoMovil(false);
  }

  // Detectar al cargar y en cada resize/rotación
  detectar();
  window.addEventListener('resize', detectar);

  // En móvil, las ventanas nuevas deben abrirse maximizadas
  // Parcheamos crearVentana para que en modo móvil siempre maximice
  const _origCrearVentana = crearVentana;
  window.crearVentana = function(opts) {
    const win = _origCrearVentana(opts);
    if (modoMovil && win) win.classList.add('maximized');
    return win;
  };

  // Deshabilitar drag de titlebar en móvil (el titlebar usa mousedown nativo)
  // Lo hacemos interceptando el evento en la fase de captura
  document.addEventListener('mousedown', function(e) {
    if (!modoMovil) return;
    const tb = e.target.closest('.window-titlebar');
    if (tb && !e.target.closest('.win-btn')) {
      e.stopImmediatePropagation();
    }
  }, true);

  // Deshabilitar resize handle en móvil
  document.addEventListener('mousedown', function(e) {
    if (!modoMovil) return;
    if (e.target.closest('.resize-handle')) e.stopImmediatePropagation();
  }, true);

  // Manejar apertura automática del navegador vía URL param
  (function handleDeepLink() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('open_browser');
    if (targetUrl) {
      // Pequeño delay para asegurar que el sistema está listo
      setTimeout(() => abrirBrowser(targetUrl), 500);
      // Limpiar la URL para que no se reabra al recargar
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  })();

  // ── NANAMY AI LOGIC ──
  const nanamyAiPanel = document.getElementById('nanamy-ai-panel');
  const nanamyAiBtn = document.getElementById('nanamy-ai-btn');
  const nanamyAiChat = document.getElementById('nanamy-ai-chat');
  const nanamyAiInput = document.getElementById('nanamy-ai-input');
  const nanamyAiSend = document.getElementById('nanamy-ai-send');

  window.toggleNanamyAi = function() {
    const isShowing = nanamyAiPanel.classList.toggle('show');
    nanamyAiBtn.classList.toggle('active', isShowing);
    if (isShowing) {
      if (nanamyAiChat.children.length === 0) {
        addMsg(_t('ai.welcome'), 'ai');
      }
      nanamyAiInput.focus();
    }
  };

  nanamyAiBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleNanamyAi();
  });

  async function enviarMensajeNanamyAi() {
    const texto = nanamyAiInput.value.trim();
    if (!texto) return;

    nanamyAiInput.value = '';
    addMsg(texto, 'user');

    const aiDiv = addMsg(_t('ai.thinking'), 'ai');

    try {
      const persona = localStorage.getItem('nanamyos_ai_persona') || '';
      const r = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: texto, persona: persona })
      });
      const data = await r.json();
      aiDiv.textContent = data.response || 'Sin respuesta';
    } catch(e) {
      aiDiv.textContent = _t('ai.error');
    }
    nanamyAiChat.scrollTop = nanamyAiChat.scrollHeight;
  }

  function addMsg(text, role) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    nanamyAiChat.appendChild(div);
    nanamyAiChat.scrollTop = nanamyAiChat.scrollHeight;
    return div;
  }

  nanamyAiSend.addEventListener('click', enviarMensajeNanamyAi);
  nanamyAiInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enviarMensajeNanamyAi();
  });

  // Cerrar si se hace clic fuera del panel (opcional)
  document.addEventListener('click', (e) => {
    if (nanamyAiPanel.classList.contains('show') &&
        !nanamyAiPanel.contains(e.target) &&
        !nanamyAiBtn.contains(e.target)) {
      toggleNanamyAi();
    }
  });

})();
</script>
</body>
</html>
